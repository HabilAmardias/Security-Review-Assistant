# App configuration. Edit this file to pick your Ollama models and tune behaviour.

llm:
  # Ollama server location (local, on-premise)
  base_url: "http://127.0.0.1:11434"
  # Reasoning model used for fact extraction + final security decision.
  # Change freely to any model you have pulled, e.g. qwen3:8b, llama3.1:8b, qwen2.5:14b
  reasoning_model: "gemma4:12b-mlx"
  # Embedding model used to index SOP/policy/previous-review documents.
  # When you change the embedding model, update embedding_dim to its output size.
  # On the next restart the vector index is rebuilt automatically from the cached
  # plaintext (no PDFs/passwords needed); you can also trigger it from the UI
  # ("Rebuild index" on the Knowledge Base page).
  embedding_model: "embeddinggemma:300m"
  embedding_dim: 768
  temperature: 0.1
  max_tokens: 4096
  # Context window (tokens) for the reasoning model. Ollama defaults to 4096,
  # which truncates long review prompts. qwen3.x handles 32K+; set to what your
  # model supports (raise if reviews return empty/broken output).
  num_ctx: 16384
  # qwen3.x models default to reasoning mode and can burn the whole output token
  # budget on thinking, returning an empty answer. Keep `false` for structured
  # JSON output; set `true` (and raise max_tokens) to keep reasoning enabled.
  enable_thinking: true
  # Timeout in seconds for Ollama requests. `null` (default) disables the
  # timeout entirely — needed for slow local models on first load / long reviews.
  request_timeout_sec: null

extraction:
  # auto | text | ocr
  #   text -> pypdf text layer only
  #   ocr  -> run ocrmypdf/tesseract on every PDF
  #   auto -> try text; if char density falls below auto_detect_threshold
  #           chars/page, flag the doc as NEEDS_OCR (you can run OCR from the UI)
  default_mode: "auto"
  auto_detect_threshold: 50

data_dir: "data"
poll_interval_sec: 10
chunk_size: 900
chunk_overlap: 120
embed_batch_size: 64
retrieval_top_k: 6
review_max_input_chars: 60000
# Deterministic rule engine (compliance.yaml rules). Set to false to run
# LLM-only reviews — no rules fired, no rule-vs-LLM conflict check.
enable_rule_engine: true
