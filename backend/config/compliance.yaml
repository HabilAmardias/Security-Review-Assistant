# Deterministic rule engine definitions.
# The review agent fires these rules from facts extracted from the FRD/NFRD and
# shows them in the report. Only the exposure-based decision rules are kept:
#   - intranet/internal apps are capped at DAST
#   - internet/public apps get a DAST floor; whether pentest is also needed is
#     decided by the review analysis (LLM + human), not by a rule
compliance:
  rules:
    - id: "R-06"
      name: "Internet-facing / public application"
      triggers:
        exposure: ["internet-facing", "partner"]
        keywords: ["internet", "public", "customer-facing", "external"]
      action:
        test_level: "dast"
        priority: "medium"
      reasoning: "Internet/public-facing applications are externally reachable, so DAST is the minimum requirement. Whether a pentest is also needed is decided by the review analysis."

    - id: "R-11"
      name: "Intranet / internal-only application (caps at DAST)"
      triggers:
        exposure: ["internal"]
        features: ["internal"]
      action:
        test_level: "dast"
        priority: "medium"
        cap: "dast"
      reasoning: "Intranet applications are not externally reachable; automated DAST is sufficient. This rule caps the overall requirement at DAST regardless of other rules that fire."
