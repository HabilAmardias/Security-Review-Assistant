# Compliance frameworks and deterministic rule engine definitions.
# The review agent cites these frameworks in its reasoning and the rule engine
# fires rules based on facts extracted from the FRD/NFRD.
compliance:
  enabled:
    - owasp_asvs
    - owasp_api
    - nist_ssdf
    - nist_sp800_53
    - pci_dss
    - iso_27001
    - soc2
    - gdpr
    - hipaa
    - uu_pdp
    - pojk

  frameworks:
    owasp_asvs:
      name: "OWASP Application Security Verification Standard (ASVS)"
      description: "Baseline + advanced web app security verification. Level 2 recommended for most apps, L3 for high-value."
      test_level: "both"
    owasp_api:
      name: "OWASP API Security Top 10"
      description: "Authentication, authorization, and API-specific flaws (BOLA, mass assignment, rate limiting)."
      test_level: "dast"
    nist_ssdf:
      name: "NIST Secure Software Development Framework (SSDF)"
      description: "Secure development lifecycle requirements applicable to the build/review pipeline."
      test_level: "both"
    nist_sp800_53:
      name: "NIST SP 800-53"
      description: "Security and privacy controls catalog for federal/enterprise systems."
      test_level: "pentest"
    pci_dss:
      name: "PCI DSS v4.0"
      description: "Required when cardholder data is stored, processed, or transmitted."
      test_level: "both"
    iso_27001:
      name: "ISO/IEC 27001"
      description: "Information security management requirements; annex A controls for app security."
      test_level: "both"
    soc2:
      name: "SOC 2 Trust Services Criteria"
      description: "Security/availability/confidentiality criteria for SaaS vendors."
      test_level: "both"
    gdpr:
      name: "EU General Data Protection Regulation (GDPR)"
      description: "Personal data of EU residents: data protection by design, DPIAs."
      test_level: "both"
    hipaa:
      name: "HIPAA Security Rule"
      description: "Required for protected health information (PHI/PHI-related systems)."
      test_level: "both"
    uu_pdp:
      name: "Undang-Undang Perlindungan Data Pribadi (UU PDP) No. 27/2022"
      description: "Indonesian personal data protection law; DPO appointment, DPIA for high-risk processing."
      test_level: "both"
    pojk:
      name: "POJK / OJK technology & cybersecurity regulations"
      description: "Indonesian financial services cybersecurity requirements (e.g., POJK No. 11/2022)."
      test_level: "both"

  # Deterministic rules. Fired rules are shown in the report and passed to the
  # LLM; any high-priority rule forces at least the indicated test level.
  rules:
    - id: "R-01"
      name: "Payment / cardholder data processing"
      triggers:
        data_classes: ["payment"]
        keywords: ["credit card", "cardholder", "pci", "pci-dss", "tokenization", "payment", "pembayaran", "kartu kredit", "kartu debit", "e-money", "e-wallet"]
      action:
        test_level: "both"
        priority: "high"
      reasoning: "Processing of payment/cardholder data mandates DAST of payment flows plus manual pentest of payment, refund, and tokenization logic (PCI DSS, OWASP ASVS L2)."
      frameworks: ["pci_dss", "owasp_asvs", "owasp_api"]

    - id: "R-02"
      name: "Protected health information (PHI)"
      triggers:
        data_classes: ["phi"]
        keywords: ["health", "medical", "patient", "hipaa", "phi", "kesehatan", "pasien", "rekam medis"]
      action:
        test_level: "both"
        priority: "high"
      reasoning: "Systems processing protected health information require both automated scanning and manual pentest of authorization/access controls (HIPAA)."
      frameworks: ["hipaa", "owasp_asvs"]

    - id: "R-03"
      name: "Personal data / privacy-sensitive processing"
      triggers:
        data_classes: ["pii"]
        keywords: ["personal data", "pii", "gdpr", "data pribadi", "privacy", "kebocoran data", "profil", "biometric"]
      action:
        test_level: "both"
        priority: "medium"
      reasoning: "Processing of personal data (incl. Indonesian PDP law scope) warrants DAST plus targeted manual review of data access, retention, and export controls."
      frameworks: ["gdpr", "uu_pdp", "iso_27001"]

    - id: "R-04"
      name: "Financial services / regulatory"
      triggers:
        data_classes: ["financial"]
        keywords: ["loan", "lending", "banking", "fintech", "pojk", "ojk", "insurance", "pinjaman", "tabungan", "saldo", "investasi"]
      action:
        test_level: "both"
        priority: "high"
      reasoning: "Financial services applications are subject to POJK/OJK cybersecurity requirements and warrant full pentest coverage of financial transactions."
      frameworks: ["pojk", "nist_sp800_53", "owasp_asvs"]

    - id: "R-05"
      name: "Authentication / authorization is core"
      triggers:
        features: ["authentication", "oauth", "sso", "mfa", "role", "permission", "authorization", "authz", "admin"]
      action:
        test_level: "pentest"
        priority: "high"
      reasoning: "Applications whose core function involves authentication or authorization (multi-role, admin, B2B SSO) require manual pentest of auth logic, not just scanning."
      frameworks: ["owasp_asvs", "owasp_api", "nist_ssdf"]

    - id: "R-06"
      name: "Internet-facing / high exposure"
      triggers:
        features: ["internet-facing", "public", "external", "customer-facing", "internet"]
      action:
        test_level: "dast"
        priority: "medium"
      reasoning: "Internet-exposed applications should at minimum undergo full DAST against OWASP Top 10 / ASVS low-level checks on every release."
      frameworks: ["owasp_asvs", "owasp_api"]

    - id: "R-07"
      name: "Third-party / open integration surface"
      triggers:
        features: ["integration", "api", "webhook", "callback", "sso", "saml", "openid", "third-party"]
      action:
        test_level: "pentest"
        priority: "medium"
      reasoning: "Open integration points (APIs, webhooks, SSO) expand attack surface and require manual testing of trust boundaries and input handling."
      frameworks: ["owasp_api", "owasp_asvs"]

    - id: "R-08"
      name: "Credentials / secrets handling"
      triggers:
        data_classes: ["credentials"]
        keywords: ["password", "credential", "secret", "token", "api key", "ssn", "nip", "npwp"]
      action:
        test_level: "pentest"
        priority: "high"
      reasoning: "Handling of credentials/secrets mandates manual review of storage, transmission, rotation, and session management."
      frameworks: ["owasp_asvs", "nist_sp800_53"]

    - id: "R-09"
      name: "No sensitive data, internal tool only"
      triggers:
        data_classes: ["none"]
        features: ["internal"]
      action:
        test_level: "dast"
        priority: "low"
      reasoning: "Internal tool with no sensitive data: automated DAST plus focused review is sufficient; full pentest not warranted."
      frameworks: ["owasp_asvs"]

    - id: "R-10"
      name: "Regulatory / compliance explicitly requested"
      triggers:
        features: ["compliance", "audit", "iso", "soc", "gdpr", "certification", "sertifikasi"]
      action:
        test_level: "pentest"
        priority: "medium"
      reasoning: "Explicit compliance/certification targets (ISO 27001, SOC 2, PCI, UU PDP) typically demand documented pentest evidence."
      frameworks: ["iso_27001", "soc2", "nist_sp800_53"]
